name: Deploy to Cloudflare Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.3"
      - name: Verify existing Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3441724797f692af21f432e8625165d9
          NAME: ${{ github.event.repository.name }}
          APP_PASSCODE: ${{ secrets.APP_PASSCODE }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set; refusing deployment."
            exit 1
          fi
          if [ -z "$APP_PASSCODE" ]; then
            echo "::error::APP_PASSCODE is not set; refusing deployment."
            exit 1
          fi
          if ! pages_secrets="$(npx -y wrangler@4 pages secret list --project-name="$NAME" 2>/dev/null)"; then
            echo "::error::Could not read existing Cloudflare Pages secret names; refusing deployment."
            exit 1
          fi
          for required in APP_PASSCODE NOTION_TOKEN; do
            if ! printf '%s\n' "$pages_secrets" | grep -Eq "(^|[^A-Za-z0-9_])${required}([^A-Za-z0-9_]|$)"; then
              echo "::error::Required Cloudflare Pages secret is missing: $required; refusing deployment."
              exit 1
            fi
          done
      - name: Verify current production API and Notion access
        env:
          APP_PASSCODE: ${{ secrets.APP_PASSCODE }}
          BASE_URL: https://mente-tracker.pages.dev
        run: |
          node --input-type=module <<'NODE'
          const passcode = process.env.APP_PASSCODE;
          if (!passcode || passcode.trim() === "") throw new Error("APP_PASSCODE is unavailable for preflight");
          const response = await fetch(`${process.env.BASE_URL}/api/list`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-app-pass": passcode },
            body: "{}",
            signal: AbortSignal.timeout(15000),
          });
          if (response.status !== 200) throw new Error(`Current production list returned HTTP ${response.status}; refusing deployment`);
          const result = await response.json();
          if (!Array.isArray(result.items)) throw new Error("Current production list response is invalid; refusing deployment");
          console.log("Current production authentication and Notion read preflight passed.");
          NODE
      - name: Deploy approved public files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3441724797f692af21f432e8625165d9
          NAME: ${{ github.event.repository.name }}
        run: |
          # wrangler pages deploy publishes every file in its directory. Collect only
          # approved public files in _site (security review fix, 2026-07-11). Add new
          # public files to the copy list above before deploying them.
          mkdir -p _site
          cp index.html 404.html manifest.json sw.js icon-192.png icon-512.png _site/
          cp -r functions _site/functions
          npx -y wrangler@4 pages deploy _site --project-name="$NAME" --branch=main --commit-dirty=true

      - name: Verify production API authentication and list
        env:
          APP_PASSCODE: ${{ secrets.APP_PASSCODE }}
          BASE_URL: https://mente-tracker.pages.dev
        run: |
          node --input-type=module <<'NODE'
          const passcode = process.env.APP_PASSCODE;
          if (!passcode || passcode.trim() === "") throw new Error("APP_PASSCODE is unavailable for smoke test");
          const url = `${process.env.BASE_URL}/api/list`;
          async function query(pass) {
            const headers = { "Content-Type": "application/json" };
            if (pass !== null) headers["x-app-pass"] = pass;
            return fetch(url, {
              method: "POST",
              headers,
              body: "{}",
              signal: AbortSignal.timeout(15000),
            });
          }
          const unauthenticated = await query(null);
          if (unauthenticated.status !== 401) throw new Error(`Unauthenticated API returned HTTP ${unauthenticated.status}`);
          let wrongPasscode = `invalid-smoke-${crypto.randomUUID()}`;
          if (wrongPasscode === passcode) wrongPasscode += "-x";
          const incorrect = await query(wrongPasscode);
          if (incorrect.status !== 401) throw new Error(`Incorrect passcode returned HTTP ${incorrect.status}`);
          const authenticated = await query(passcode);
          if (authenticated.status !== 200) throw new Error(`Authenticated list returned HTTP ${authenticated.status}`);
          const result = await authenticated.json();
          if (!Array.isArray(result.items)) throw new Error("Authenticated list response is invalid");
          console.log(`Production auth/list smoke test passed (${result.items.length} items).`);
          NODE

      # Keep commit logging in this job so it runs only after a successful deploy.
      - name: Send commits to Notion
        if: ${{ success() }}
        uses: actions/github-script@v9
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_COMMITS_DB_ID: ${{ vars.NOTION_COMMITS_DB_ID }}
          NOTION_APP_PAGE_ID: ${{ vars.NOTION_APP_PAGE_ID }}
        with:
          script: |
            const token = process.env.NOTION_TOKEN;
            const dbId = process.env.NOTION_COMMITS_DB_ID;
            const appId = process.env.NOTION_APP_PAGE_ID;
            if (!token || !dbId) {
              core.setFailed('NOTION_TOKEN or NOTION_COMMITS_DB_ID is not set');
              return;
            }
            const notionHeaders = {
              'Authorization': `Bearer ${token}`,
              'Notion-Version': '2022-06-28',
              'Content-Type': 'application/json',
            };
            // Translate commit message to Japanese via free Google endpoint (no key, no LLM tokens).
            // sl=auto so messages already in Japanese pass through unchanged. Falls back to original on any error.
            async function toJa(text) {
              try {
                const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ja&dt=t&q=' + encodeURIComponent(text);
                const r = await fetch(url);
                if (!r.ok) { core.warning('translate HTTP ' + r.status); return text; }
                const data = await r.json();
                const ja = (data[0] || []).map(seg => seg[0]).join('');
                return ja || text;
              } catch (e) {
                core.warning('translate failed: ' + e);
                return text;
              }
            }
            const repo = context.repo.repo;
            const commits = context.payload.commits || [];
            core.info(`Sending ${commits.length} commit(s) to Notion`);
            // Notion's database query is eventually consistent: a page created moments ago can be
            // missing from the query below, and rewriting the relation would then silently unlink
            // it. Remember what we create so the reorder can re-attach it (149 rows were lost
            // this way between 2026-06-21 and 2026-08-11 before anyone noticed).
            const created = [];
            for (const c of commits) {
              const en = ((c.message || '').split('\n')[0] || c.id).slice(0, 200);
              const ja = (await toJa(en)).slice(0, 200);
              const props = {
                "名前":   { title: [{ text: { content: ja } }] },
                "原文":   { rich_text: [{ text: { content: en } }] },
                "SHA":    { rich_text: [{ text: { content: c.id.slice(0, 7) } }] },
                "Author": { rich_text: [{ text: { content: (c.author && c.author.name) || '' } }] },
                "Date":   { date: { start: c.timestamp } },
                "URL":    { url: c.url },
                "Repo":   { rich_text: [{ text: { content: repo } }] },
              };
              if (appId) props["App"] = { relation: [{ id: appId }] };
              const resp = await fetch('https://api.notion.com/v1/pages', {
                method: 'POST',
                headers: notionHeaders,
                body: JSON.stringify({ parent: { database_id: dbId }, properties: props }),
              });
              if (!resp.ok) {
                core.setFailed(`Notion API failed for ${c.id.slice(0, 7)}: ${resp.status} ${await resp.text()}`);
              } else {
                const page = await resp.json().catch(() => null);
                if (page && page.id) created.push(page.id);
                core.info(`Logged ${c.id.slice(0, 7)}: ${ja}`);
              }
            }
            // Keep this app's commit log newest-first and bounded. Notion shows relation items in
            // stored order (new links append at the bottom), and a relation write is capped at 100.
            // So each push: fetch all of this app's commits Date-descending, archive (trash) the
            // oldest beyond KEEP, then rewrite the relation to the kept ids (always <= KEEP < 100).
            const KEEP = 90;
            if (appId) {
              try {
                const ids = [];
                let cursor = undefined, more = true;
                while (more) {
                  const qb = {
                    filter: { property: "App", relation: { contains: appId } },
                    sorts: [{ property: "Date", direction: "descending" }],
                    page_size: 100,
                  };
                  if (cursor) qb.start_cursor = cursor;
                  const qr = await fetch(`https://api.notion.com/v1/databases/${dbId}/query`, {
                    method: 'POST', headers: notionHeaders, body: JSON.stringify(qb),
                  });
                  if (!qr.ok) { core.warning('reorder query failed: ' + qr.status); break; }
                  const qj = await qr.json();
                  for (const pg of (qj.results || [])) ids.push(pg.id);
                  more = qj.has_more; cursor = qj.next_cursor;
                }
                const missed = created.filter(id => !ids.includes(id));
                if (missed.length) {
                  ids.unshift(...missed);
                  core.info(`Re-attached ${missed.length} row(s) the query had not indexed yet`);
                }
                // Trim the oldest commits beyond KEEP so we never hit the relation write cap.
                if (ids.length > KEEP) {
                  const toTrash = ids.slice(KEEP);
                  for (const id of toTrash) {
                    const ar = await fetch(`https://api.notion.com/v1/pages/${id}`, {
                      method: 'PATCH', headers: notionHeaders,
                      body: JSON.stringify({ archived: true }),
                    });
                    if (!ar.ok) core.warning('archive failed for ' + id + ': ' + ar.status);
                  }
                  ids.length = KEEP;
                  core.info(`Trimmed ${toTrash.length} oldest commit(s) to keep newest ${KEEP}`);
                }
                if (ids.length > 0) {
                  const pr = await fetch(`https://api.notion.com/v1/pages/${appId}`, {
                    method: 'PATCH', headers: notionHeaders,
                    body: JSON.stringify({ properties: { "Related to コミットDB (App)": { relation: ids.map(id => ({ id })) } } }),
                  });
                  if (!pr.ok) core.warning('reorder patch failed: ' + pr.status + ' ' + await pr.text());
                  else core.info(`Reordered ${ids.length} relation(s) newest-first`);
                }
              } catch (e) {
                core.warning('reorder failed: ' + e);
              }
            }
